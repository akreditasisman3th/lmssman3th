<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS SMAN 3 Tapung Hulu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2dd4bf', // Teal/Cyan matching the logo's inner circle roughly
                        primaryDark: '#0e7490',
                        accent: '#f59e0b', // Gold/Orange matching the wings/ribbon
                        accentDark: '#d97706',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0fdfa; /* Very light cyan */
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER -->
    <div id="loginView" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 fade-in border-t-8 border-primary relative overflow-hidden">
        
        <!-- Decorative Header Background -->
        <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-primary/20 to-transparent -z-10"></div>
        
        <div class="text-center mb-8 pt-4">
            <div class="w-24 h-24 mx-auto bg-white rounded-full border-4 border-accent shadow-md flex items-center justify-center mb-4 overflow-hidden">
                <img src="https://cdn.phototourl.com/member/2026-10-22-807db4f8-e31f-4ee0-a6d3-440b8bb6922f.png" alt="Logo SMAN 3 Tapung Hulu" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-bold text-primaryDark">Portal LMS</h1>
            <p class="text-sm text-gray-500 mt-1">SMAN 3 Tapung Hulu</p>
        </div>

        <div id="errorMessage" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-3 mb-4 text-sm rounded">
            Username atau password salah!
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="Masukkan username" required>
            </div>
            
            <div class="mb-6">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="Masukkan password" required>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:-translate-y-1">
                MASUK
            </button>
        </form>

        <p class="text-xs text-center text-gray-400 mt-8">
            © 2026 SMAN 3 Tapung Hulu.<br>
        </p>
    </div>

    <!-- MAIN APP LAYOUT (SIDEBAR & KONTEN UTAMA) -->
    <div id="appLayout" class="hidden fixed inset-0 w-full h-full bg-gray-50 flex overflow-hidden z-50">
        
        <!-- Overlay untuk Sidebar di Layar HP -->
        <div id="mobileOverlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-gray-800 bg-opacity-50 z-20 md:hidden transition-opacity"></div>

        <!-- Sidebar Navigation (Kiri) -->
        <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 flex-shrink-0 transition-transform transform -translate-x-full md:translate-x-0 absolute md:relative z-30 h-full flex flex-col shadow-xl md:shadow-none">
            <!-- Area Logo & Nama Sekolah -->
            <div class="h-16 flex items-center px-5 border-b border-gray-100 bg-white">
                <img src="https://cdn.phototourl.com/member/2026-10-22-807db4f8-e31f-4ee0-a6d3-440b8bb6922f.png" alt="Logo SMAN 3" class="h-10 w-10 object-contain mr-3 rounded-full border border-gray-100 p-0.5">
                <span class="font-bold text-lg text-primaryDark leading-tight tracking-wide">LMS<br><span class="text-sm text-gray-500">SMAN 3 TH</span></span>
            </div>
            
            <!-- Daftar Menu -->
            <div class="flex-1 overflow-y-auto py-4 scrollbar-hide">
                <p class="px-5 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Menu Utama</p>
                <ul id="sidebarMenu" class="space-y-1 px-3">
                    <!-- Menu dinamis akan disuntikkan oleh JavaScript ke sini -->
                </ul>
            </div>

            <!-- Footer Sidebar -->
            <div class="p-4 border-t border-gray-100 bg-gray-50">
                <p class="text-xs text-center text-gray-400">© 2026 SMAN 3 TH<br>Versi 2.0</p>
            </div>
        </aside>

        <!-- Area Utama (Kanan) -->
        <div class="flex-1 flex flex-col h-full relative overflow-hidden bg-gray-50">
            
            <!-- Top Navbar (Atas) -->
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 lg:px-8 z-10 shadow-sm flex-shrink-0">
                <div class="flex items-center">
                    <!-- Tombol Hamburger untuk HP -->
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-primary mr-4 p-1 focus:outline-none transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <!-- Judul Halaman Aktif -->
                    <h2 id="pageTitle" class="text-xl md:text-2xl font-bold text-gray-800 tracking-tight">Dasbor</h2>
                </div>
                
                <!-- User Profile & Dropdown (Kanan Atas) -->
                <div class="relative">
                    <button onclick="toggleProfileMenu(event)" class="flex items-center space-x-3 focus:outline-none hover:bg-gray-50 p-1.5 md:p-2 rounded-xl transition duration-200 border border-transparent hover:border-gray-100">
                        <div class="text-right hidden sm:block">
                            <p id="topbarUserName" class="text-sm font-bold text-gray-800 leading-tight">Nama User</p>
                            <p id="topbarUserRole" class="text-xs font-semibold text-primary uppercase tracking-wider">Role</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-accent text-white flex items-center justify-center font-bold shadow-sm border-2 border-white ring-2 ring-gray-100" id="topbarUserInitials">
                            U
                        </div>
                        <svg class="w-4 h-4 text-gray-400 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <!-- Isi Dropdown Menu -->
                    <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-2 z-50 transform origin-top-right transition-all">
                        <div class="px-4 py-3 border-b border-gray-50 sm:hidden">
                            <p id="mobileUserName" class="text-sm font-bold text-gray-800">Nama User</p>
                            <p id="mobileUserRole" class="text-xs font-semibold text-primary uppercase">Role</p>
                        </div>
                        <a href="#" onclick="openMenu('Profil', event)" class="flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-primary/5 hover:text-primary transition">
                            <span class="mr-3 text-lg">👤</span> Profil Saya
                        </a>
                        <a href="#" onclick="openMenu('Pengaturan', event)" class="flex items-center px-4 py-2.5 text-sm text-gray-700 hover:bg-primary/5 hover:text-primary transition">
                            <span class="mr-3 text-lg">⚙️</span> Pengaturan
                        </a>
                        <div class="border-t border-gray-100 my-1"></div>
                        <button onclick="logout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 font-semibold hover:bg-red-50 transition flex items-center">
                            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Keluar dari LMS
                        </button>
                    </div>
                </div>
            </header>

            <!-- Container Konten Dinamis -->
            <main id="mainContent" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 w-full max-w-7xl mx-auto">
                <!-- Konten HTML khusus menu akan disuntikkan ke sini -->
            </main>
        </div>
    </div>

    <script>
        // Variabel Global untuk menyimpan data user yang login
        let currentUser = { name: '', role: '' };

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            btn.innerText = "Memeriksa...";
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6wqbNms4814EaGetmihagvuSS-0gbptZsi5RPoaa5XP1poCdtR0ayaLuGb5GpO5DV/exec";
            const apiUrl = `${APP_SCRIPT_URL}?action=login&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`;
            
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    onLoginSuccess(data);
                })
                .catch(error => {
                    onLoginError(error);
                });
        }

        function onLoginError(error) {
            const btn = document.getElementById('loginBtn');
            btn.innerText = "MASUK";
            btn.disabled = false;
            
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.innerText = "Terjadi kesalahan jaringan.";
            errorMsg.classList.remove('hidden');
        }

        function onLoginSuccess(response) {
            const btn = document.getElementById('loginBtn');
            btn.innerText = "MASUK";
            btn.disabled = false;

            if (response.success) {
                // Sembunyikan Halaman Login, Tampilkan App Layout Utama
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('appLayout').classList.remove('hidden');
                
                // Simpan data user
                currentUser = { name: response.name, role: response.role };

                // Update teks di Header Topbar
                document.getElementById('topbarUserName').innerText = response.name;
                document.getElementById('topbarUserRole').innerText = response.role;
                document.getElementById('mobileUserName').innerText = response.name;
                document.getElementById('mobileUserRole').innerText = response.role;
                
                // Ambil inisial nama (huruf pertama)
                document.getElementById('topbarUserInitials').innerText = response.name.charAt(0).toUpperCase();

                // Render Sidebar Menu sesuai Role
                renderSidebar(response.role);
                
                // Langsung Buka Halaman "Dasbor" secara otomatis saat login
                openMenu('Dasbor');
            } else {
                const errorMsg = document.getElementById('errorMessage');
                errorMsg.innerText = response.message;
                errorMsg.classList.remove('hidden');
            }
        }

        function logout() {
            // Sembunyikan Layout App, Kembali ke Login
            document.getElementById('appLayout').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('profileDropdown').classList.add('hidden'); // Tutup dropdown
        }

        // ==========================================
        // FUNGSI UNTUK MENGATUR SIDEBAR & DROPDOWN
        // ==========================================

        // Menampilkan Sidebar Menu di Kiri
        function renderSidebar(role) {
            const sidebarMenu = document.getElementById('sidebarMenu');
            sidebarMenu.innerHTML = ''; 

            let menus = [];

            if (role === 'Admin' || role === 'Guru') {
                menus = [
                    { title: 'Dasbor', icon: '🏠' },
                    { title: 'Manajemen Kelas', icon: '🏫' },
                    { title: 'Modul Pembelajaran', icon: '📚' },
                    { title: 'Penugasan', icon: '✍️' },
                    { title: 'Evaluasi & Kuis', icon: '📝' },
                    { title: 'Buku Nilai', icon: '📊' },
                    { title: 'Forum Diskusi', icon: '💬' },
                    { title: 'Daftar Pengguna', icon: '👥' },
                    { title: 'Absensi', icon: '✅' }
                ];
            } else if (role === 'Murid') {
                menus = [
                    { title: 'Dasbor', icon: '🏠' },
                    { title: 'Ruang Belajar', icon: '🏫' },
                    { title: 'Modul Pembelajaran', icon: '📚' },
                    { title: 'Tugas Saya', icon: '✍️' },
                    { title: 'Kuis & Ujian', icon: '📝' },
                    { title: 'Nilai Saya', icon: '📊' },
                    { title: 'Forum Diskusi', icon: '💬' },
                    { title: 'Absensi', icon: '✅' }
                ];
            } else if (role === 'Wali Murid') {
                menus = [
                    { title: 'Dasbor', icon: '🏠' },
                    { title: 'Tugas Anak', icon: '✍️' },
                    { title: 'Nilai Anak', icon: '📊' },
                    { title: 'Forum Komunikasi', icon: '💬' },
                    { title: 'Absensi Anak', icon: '✅' }
                ];
            }

            // Menyuntikkan list <li> ke dalam ul Sidebar
            menus.forEach(menu => {
                const li = document.createElement('li');
                const menuId = 'menu-' + menu.title.replace(/\s+/g, '-');
                li.innerHTML = `
                    <a href="#" id="${menuId}" onclick="openMenu('${menu.title}', event)" class="sidebar-link flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-600 font-medium hover:bg-primary/10 hover:text-primary transition duration-200">
                        <span class="text-xl w-6 text-center">${menu.icon}</span>
                        <span>${menu.title}</span>
                    </a>
                `;
                sidebarMenu.appendChild(li);
            });
        }

        // Buka / Tutup Sidebar di layar kecil (HP)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Buka / Tutup Dropdown Profil di kanan atas
        function toggleProfileMenu(e) {
            if(e) e.stopPropagation();
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('hidden');
        }

        // Menutup Dropdown secara otomatis jika klik di luar area
        window.onclick = function(event) {
            if (!event.target.closest('.relative')) {
                const dropdown = document.getElementById('profileDropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                }
            }
        }

        // ==========================================
        // FUNGSI UNTUK MEMBUKA HALAMAN & KONTENNYA
        // ==========================================

        function openMenu(title, event) {
            if(event) event.preventDefault(); // Mencegah scroll ke atas
            
            // 1. Ubah Judul di Header Atas
            document.getElementById('pageTitle').innerText = title;

            // 2. Beri efek "Aktif" pada link sidebar yang diklik
            document.querySelectorAll('.sidebar-link').forEach(el => {
                el.classList.remove('bg-primary/10', 'text-primary', 'font-semibold');
                el.classList.add('text-gray-600');
            });
            const activeId = 'menu-' + title.replace(/\s+/g, '-');
            const activeEl = document.getElementById(activeId);
            if(activeEl) {
                activeEl.classList.remove('text-gray-600');
                activeEl.classList.add('bg-primary/10', 'text-primary', 'font-semibold');
            }

            // 3. Tutup Sidebar otomatis setelah diklik (Khusus tampilan HP)
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                if(!sidebar.classList.contains('-translate-x-full')) {
                    toggleSidebar();
                }
            }

            // 4. Tutup Dropdown profil (jika yang diklik dari dropdown)
            document.getElementById('profileDropdown').classList.add('hidden');

            // 5. Render Konten Halamannya
            renderMenuContent(title);
        }

        function renderMenuContent(title) {
            const contentArea = document.getElementById('mainContent');
            const role = currentUser.role;
            const userName = currentUser.name;
            
            // Efek Loading singkat
            contentArea.innerHTML = `
                <div class="flex justify-center items-center h-64 fade-in">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary"></div>
                    <span class="ml-3 text-gray-500 font-medium">Memuat ${title}...</span>
                </div>
            `;

            setTimeout(() => {
                let html = '';
                
                // === DESAIN HALAMAN "DASBOR" (HOME) ===
                if(title === 'Dasbor' || title === 'Beranda') {
                    html = `
                        <div class="fade-in">
                            <!-- Banner Welcome -->
                            <div class="bg-gradient-to-r from-primaryDark to-primary rounded-2xl p-6 md:p-10 text-white shadow-lg mb-8 relative overflow-hidden">
                                <div class="relative z-10">
                                    <h3 class="text-2xl md:text-3xl font-bold mb-2">Selamat datang, ${userName}!</h3>
                                    <p class="text-primary-100 text-sm md:text-base opacity-90 max-w-lg">Semoga hari ini menyenangkan. Berikut adalah ringkasan aktivitas ${role} Anda di LMS SMAN 3 Tapung Hulu.</p>
                                </div>
                                <!-- Dekorasi Logo Transparan di Kanan Banner -->
                                <img src="LOGO SMAN 3 TH.jpg" class="absolute right-0 bottom-0 opacity-10 transform translate-x-1/4 translate-y-1/4 w-64 h-64 rounded-full" alt="">
                            </div>
                            
                            <!-- Widget Kartu Statistik -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8">
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                                    <div class="w-14 h-14 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-2xl shadow-inner">🏫</div>
                                    <div><p class="text-gray-500 text-sm font-medium">Kelas Aktif</p><h4 class="text-2xl font-extrabold text-gray-800">12</h4></div>
                                </div>
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                                    <div class="w-14 h-14 rounded-full bg-green-50 text-green-500 flex items-center justify-center text-2xl shadow-inner">📚</div>
                                    <div><p class="text-gray-500 text-sm font-medium">Materi Baru</p><h4 class="text-2xl font-extrabold text-gray-800">5</h4></div>
                                </div>
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                                    <div class="w-14 h-14 rounded-full bg-orange-50 text-accent flex items-center justify-center text-2xl shadow-inner">✍️</div>
                                    <div><p class="text-gray-500 text-sm font-medium">Tugas/Ujian</p><h4 class="text-2xl font-extrabold text-gray-800">3</h4></div>
                                </div>
                                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4 hover:shadow-md transition">
                                    <div class="w-14 h-14 rounded-full bg-purple-50 text-purple-500 flex items-center justify-center text-2xl shadow-inner">💬</div>
                                    <div><p class="text-gray-500 text-sm font-medium">Pesan Masuk</p><h4 class="text-2xl font-extrabold text-gray-800">8</h4></div>
                                </div>
                            </div>

                            <!-- Papan Pengumuman Singkat -->
                            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                                <h4 class="text-lg font-bold text-gray-800 mb-4 border-l-4 border-accent pl-3">Pengumuman Terbaru</h4>
                                <ul class="space-y-3">
                                    <li class="flex items-start pb-3 border-b border-gray-50">
                                        <span class="text-xs font-bold bg-red-100 text-red-600 px-2 py-1 rounded mt-0.5 mr-3 shrink-0">PENTING</span>
                                        <div><p class="text-gray-800 font-medium">Ujian Tengah Semester Ganjil dimulai Senin depan.</p><p class="text-xs text-gray-500 mt-1">Oleh: Kurikulum - 2 hari yang lalu</p></div>
                                    </li>
                                    <li class="flex items-start">
                                        <span class="text-xs font-bold bg-blue-100 text-blue-600 px-2 py-1 rounded mt-0.5 mr-3 shrink-0">INFO</span>
                                        <div><p class="text-gray-800 font-medium">Jadwal ekskul Pramuka dimajukan menjadi pukul 15.00 WIB.</p><p class="text-xs text-gray-500 mt-1">Oleh: Kesiswaan - 4 hari yang lalu</p></div>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    `;
                } 
                // === DESAIN HALAMAN "KELAS / RUANG BELAJAR" ===
                else if (title.includes('Kelas') || title.includes('Ruang Belajar')) {
                    html = `
                        <div class="fade-in">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-xl font-bold text-gray-800">Daftar Kelas Aktif</h3>
                                ${role === 'Admin' || role === 'Guru' ? `<button class="bg-primary hover:bg-primaryDark text-white px-4 py-2 rounded-lg shadow-sm transition font-medium text-sm">+ Tambah Kelas</button>` : ''}
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition group">
                                    <div class="h-24 bg-gradient-to-r from-blue-500 to-blue-400 p-4">
                                        <h4 class="font-bold text-lg text-white group-hover:underline">Matematika Wajib</h4>
                                        <p class="text-blue-100 text-sm">Kelas X IPA 1</p>
                                    </div>
                                    <div class="p-4 relative">
                                        <div class="absolute -top-6 right-4 w-12 h-12 bg-white rounded-full flex items-center justify-center shadow font-bold text-gray-500 border border-gray-100">B</div>
                                        <p class="text-sm text-gray-600 mb-4">Pengajar: Bapak Budi</p>
                                        <button class="w-full bg-gray-50 border border-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-100 transition">Masuk Kelas</button>
                                    </div>
                                </div>
                                <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition group">
                                    <div class="h-24 bg-gradient-to-r from-green-500 to-green-400 p-4">
                                        <h4 class="font-bold text-lg text-white group-hover:underline">Biologi</h4>
                                        <p class="text-green-100 text-sm">Kelas X IPA 1</p>
                                    </div>
                                    <div class="p-4 relative">
                                        <div class="absolute -top-6 right-4 w-12 h-12 bg-white rounded-full flex items-center justify-center shadow font-bold text-gray-500 border border-gray-100">S</div>
                                        <p class="text-sm text-gray-600 mb-4">Pengajar: Ibu Siti</p>
                                        <button class="w-full bg-gray-50 border border-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-100 transition">Masuk Kelas</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
                // === DESAIN HALAMAN DEFAULT (Modul Lainnya) ===
                else {
                    html = `
                        <div class="text-center py-20 fade-in">
                            <div class="text-6xl mb-6">🚧</div>
